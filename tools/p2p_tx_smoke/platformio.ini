; Throwaway P2P smoke transmitter - proves the receiver end to end (RF link +
; frame format + decoder + MQTT) WITHOUT touching the sensor firmware.
;
; Runs on the T-Beam (the only other 433 board): transmits canned frames every
; few seconds on the shared P2P channel. Flash this, watch the Heltec receiver
; decode and publish, then move on to the real transport-seam refactor.
;
; Board/pins match the sensor firmware; the wire format comes from the
; receiver's shared header via -I.

[env:p2p-smoke]
platform = espressif32
board = ttgo-t-beam
framework = arduino
monitor_speed = 115200

lib_deps =
    jgromes/RadioLib @ ^7.1.0
    lewisxhe/XPowersLib @ ^0.1.9    ; needed only to power the LoRa rail (ALDO2/LDO2)

build_flags =
    -I ../../receiver/include
