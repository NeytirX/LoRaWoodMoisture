<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1190" width="1100" height="1190" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Oscillator breadboard layout</title>
  <desc id="d">Breadboard placement for the MCP6002 relaxation oscillator test: chip across the centre gap at rows 10 to 13, resistors, capacitors, links and power rails, with the test procedure.</desc>
  <rect width="1100" height="1190" fill="#191724"/>

  <text x="40" y="44" fill="#e0def4" font-size="24" font-weight="700">Oscillator on the breadboard · test setup</text>
  <text x="40" y="70" fill="#908caa" font-size="14">Rows 8-17 shown, columns a-j, chip across the centre gap, notch toward row 1. For learning and the 1-10 MΩ test only.</text>

  <!-- board -->
  <rect x="30" y="95" width="730" height="530" rx="12" fill="#1f1d2e" stroke="#6e6a86" stroke-width="2"/>
  <rect x="372" y="110" width="36" height="500" fill="#191724"/>

  <!-- rails -->
  <g font-size="13" font-weight="700" text-anchor="middle">
    <text x="60" y="122" fill="#eb6f92">+</text><text x="100" y="122" fill="#908caa">−</text>
    <text x="680" y="122" fill="#eb6f92">+</text><text x="720" y="122" fill="#908caa">−</text>
  </g>
  <path d="M60 135 V600 M680 135 V600" stroke="#eb6f92" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M100 135 V600 M720 135 V600" stroke="#908caa" stroke-width="2" stroke-opacity="0.5"/>

  <!-- column letters -->
  <g fill="#908caa" font-size="13" text-anchor="middle">
    <text x="180" y="122">a</text><text x="220" y="122">b</text><text x="260" y="122">c</text><text x="300" y="122">d</text><text x="340" y="122">e</text>
    <text x="440" y="122">f</text><text x="480" y="122">g</text><text x="520" y="122">h</text><text x="560" y="122">i</text><text x="600" y="122">j</text>
  </g>
  <!-- row numbers -->
  <g fill="#908caa" font-size="12" text-anchor="end">
    <text x="150" y="144">8</text><text x="150" y="194">9</text><text x="150" y="244">10</text><text x="150" y="294">11</text><text x="150" y="344">12</text>
    <text x="150" y="394">13</text><text x="150" y="444">14</text><text x="150" y="494">15</text><text x="150" y="544">16</text><text x="150" y="594">17</text>
  </g>

  <!-- holes -->
  <g fill="#26233a" stroke="#6e6a86" stroke-width="1.5">
    <circle cx="60" cy="140" r="5"/><circle cx="60" cy="190" r="5"/><circle cx="60" cy="240" r="5"/><circle cx="60" cy="290" r="5"/><circle cx="60" cy="340" r="5"/><circle cx="60" cy="390" r="5"/><circle cx="60" cy="440" r="5"/><circle cx="60" cy="490" r="5"/><circle cx="60" cy="540" r="5"/><circle cx="60" cy="590" r="5"/>
    <circle cx="100" cy="140" r="5"/><circle cx="100" cy="190" r="5"/><circle cx="100" cy="240" r="5"/><circle cx="100" cy="290" r="5"/><circle cx="100" cy="340" r="5"/><circle cx="100" cy="390" r="5"/><circle cx="100" cy="440" r="5"/><circle cx="100" cy="490" r="5"/><circle cx="100" cy="540" r="5"/><circle cx="100" cy="590" r="5"/>
    <circle cx="680" cy="140" r="5"/><circle cx="680" cy="190" r="5"/><circle cx="680" cy="240" r="5"/><circle cx="680" cy="290" r="5"/><circle cx="680" cy="340" r="5"/><circle cx="680" cy="390" r="5"/><circle cx="680" cy="440" r="5"/><circle cx="680" cy="490" r="5"/><circle cx="680" cy="540" r="5"/><circle cx="680" cy="590" r="5"/>
    <circle cx="720" cy="140" r="5"/><circle cx="720" cy="190" r="5"/><circle cx="720" cy="240" r="5"/><circle cx="720" cy="290" r="5"/><circle cx="720" cy="340" r="5"/><circle cx="720" cy="390" r="5"/><circle cx="720" cy="440" r="5"/><circle cx="720" cy="490" r="5"/><circle cx="720" cy="540" r="5"/><circle cx="720" cy="590" r="5"/>
  </g>
  <g fill="#26233a" stroke="#6e6a86" stroke-width="1.5">
    <circle cx="180" cy="140" r="5"/><circle cx="220" cy="140" r="5"/><circle cx="260" cy="140" r="5"/><circle cx="300" cy="140" r="5"/><circle cx="340" cy="140" r="5"/><circle cx="440" cy="140" r="5"/><circle cx="480" cy="140" r="5"/><circle cx="520" cy="140" r="5"/><circle cx="560" cy="140" r="5"/><circle cx="600" cy="140" r="5"/>
    <circle cx="180" cy="190" r="5"/><circle cx="220" cy="190" r="5"/><circle cx="260" cy="190" r="5"/><circle cx="300" cy="190" r="5"/><circle cx="340" cy="190" r="5"/><circle cx="440" cy="190" r="5"/><circle cx="480" cy="190" r="5"/><circle cx="520" cy="190" r="5"/><circle cx="560" cy="190" r="5"/><circle cx="600" cy="190" r="5"/>
    <circle cx="180" cy="240" r="5"/><circle cx="220" cy="240" r="5"/><circle cx="260" cy="240" r="5"/><circle cx="300" cy="240" r="5"/><circle cx="340" cy="240" r="5"/><circle cx="440" cy="240" r="5"/><circle cx="480" cy="240" r="5"/><circle cx="520" cy="240" r="5"/><circle cx="560" cy="240" r="5"/><circle cx="600" cy="240" r="5"/>
    <circle cx="180" cy="290" r="5"/><circle cx="220" cy="290" r="5"/><circle cx="260" cy="290" r="5"/><circle cx="300" cy="290" r="5"/><circle cx="340" cy="290" r="5"/><circle cx="440" cy="290" r="5"/><circle cx="480" cy="290" r="5"/><circle cx="520" cy="290" r="5"/><circle cx="560" cy="290" r="5"/><circle cx="600" cy="290" r="5"/>
    <circle cx="180" cy="340" r="5"/><circle cx="220" cy="340" r="5"/><circle cx="260" cy="340" r="5"/><circle cx="300" cy="340" r="5"/><circle cx="340" cy="340" r="5"/><circle cx="440" cy="340" r="5"/><circle cx="480" cy="340" r="5"/><circle cx="520" cy="340" r="5"/><circle cx="560" cy="340" r="5"/><circle cx="600" cy="340" r="5"/>
    <circle cx="180" cy="390" r="5"/><circle cx="220" cy="390" r="5"/><circle cx="260" cy="390" r="5"/><circle cx="300" cy="390" r="5"/><circle cx="340" cy="390" r="5"/><circle cx="440" cy="390" r="5"/><circle cx="480" cy="390" r="5"/><circle cx="520" cy="390" r="5"/><circle cx="560" cy="390" r="5"/><circle cx="600" cy="390" r="5"/>
    <circle cx="180" cy="440" r="5"/><circle cx="220" cy="440" r="5"/><circle cx="260" cy="440" r="5"/><circle cx="300" cy="440" r="5"/><circle cx="340" cy="440" r="5"/><circle cx="440" cy="440" r="5"/><circle cx="480" cy="440" r="5"/><circle cx="520" cy="440" r="5"/><circle cx="560" cy="440" r="5"/><circle cx="600" cy="440" r="5"/>
    <circle cx="180" cy="490" r="5"/><circle cx="220" cy="490" r="5"/><circle cx="260" cy="490" r="5"/><circle cx="300" cy="490" r="5"/><circle cx="340" cy="490" r="5"/><circle cx="440" cy="490" r="5"/><circle cx="480" cy="490" r="5"/><circle cx="520" cy="490" r="5"/><circle cx="560" cy="490" r="5"/><circle cx="600" cy="490" r="5"/>
    <circle cx="180" cy="540" r="5"/><circle cx="220" cy="540" r="5"/><circle cx="260" cy="540" r="5"/><circle cx="300" cy="540" r="5"/><circle cx="340" cy="540" r="5"/><circle cx="440" cy="540" r="5"/><circle cx="480" cy="540" r="5"/><circle cx="520" cy="540" r="5"/><circle cx="560" cy="540" r="5"/><circle cx="600" cy="540" r="5"/>
    <circle cx="180" cy="590" r="5"/><circle cx="220" cy="590" r="5"/><circle cx="260" cy="590" r="5"/><circle cx="300" cy="590" r="5"/><circle cx="340" cy="590" r="5"/><circle cx="440" cy="590" r="5"/><circle cx="480" cy="590" r="5"/><circle cx="520" cy="590" r="5"/><circle cx="560" cy="590" r="5"/><circle cx="600" cy="590" r="5"/>
  </g>

  <!-- chip -->
  <rect x="326" y="215" width="128" height="200" rx="5" fill="#26233a" stroke="#e0def4" stroke-width="2"/>
  <path d="M378 215 A12 12 0 0 0 402 215" fill="#191724" stroke="#e0def4" stroke-width="2"/>
  <text x="390" y="320" fill="#908caa" font-size="12" text-anchor="middle" transform="rotate(-90 390 320)">MCP6002</text>
  <g fill="#e0def4" stroke="#191724" stroke-width="1.5">
    <circle cx="340" cy="240" r="6"/><circle cx="340" cy="290" r="6"/><circle cx="340" cy="340" r="6"/><circle cx="340" cy="390" r="6"/>
    <circle cx="440" cy="240" r="6"/><circle cx="440" cy="290" r="6"/><circle cx="440" cy="340" r="6"/><circle cx="440" cy="390" r="6"/>
  </g>
  <g fill="#e0def4" font-size="11" font-weight="700">
    <text x="352" y="244">1</text><text x="352" y="294">2</text><text x="352" y="344">3</text><text x="352" y="394">4</text>
    <text x="428" y="244" text-anchor="end">8</text><text x="428" y="294" text-anchor="end">7</text><text x="428" y="344" text-anchor="end">6</text><text x="428" y="394" text-anchor="end">5</text>
  </g>

  <!-- wires -->
  <path d="M180 240 C 165 200, 160 160, 160 100" stroke="#f6c177" stroke-width="4" fill="none"/>
  <text x="168" y="104" fill="#f6c177" font-size="12" font-weight="700">to GPIO 13 / meter Hz</text>
  <path d="M180 390 C 160 355, 120 355, 100 390" stroke="#908caa" stroke-width="4" fill="none"/>
  <path d="M600 240 H680" stroke="#c4a7e7" stroke-width="4"/>
  <path d="M480 290 V340" stroke="#9ccfd8" stroke-width="4"/>
  <path d="M520 290 C 525 470, 300 420, 300 490" stroke="#9ccfd8" stroke-width="4" fill="none" stroke-dasharray="9 5"/>
  <text x="456" y="470" fill="#9ccfd8" font-size="11">jumper h11 to d15</text>

  <!-- resistors and caps -->
  <g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M260 240 V270 l6 5 l-12 10 l12 10 l-12 10 l6 5 V340" stroke="#e0def4"/>
    <path d="M180 340 V390 l6 5 l-12 10 l12 10 l-12 10 l12 10 l-12 10 l6 5 V490" stroke="#e0def4"/>
    <path d="M300 240 V250 l6 4 l-12 8 l12 8 l-12 8 l6 4 V290" stroke="#eb6f92"/>
    <path d="M220 290 V385 M208 385 H232 M208 395 H232 M220 395 V490" stroke="#e0def4"/>
    <path d="M600 390 H630 l5 -6 l10 12 l10 -12 l10 12 l5 -6 H680" stroke="#e0def4"/>
    <path d="M560 390 L640 415 M640 415 l4 -11 l8 12 l4 -11 M656 405 L720 440" stroke="#e0def4"/>
    <path d="M520 390 L600 436 M594 430 l12 -12 M606 440 l12 -12 M612 434 L720 490" stroke="#e0def4"/>
    <path d="M520 240 L600 222 M598 214 l4 16 M608 212 l4 16 M610 220 L720 190" stroke="#e0def4"/>
  </g>
  <g font-size="11" fill="#e0def4">
    <text x="268" y="300">R2 1M</text>
    <text x="134" y="452" text-anchor="end">R1 1M</text>
    <text x="230" y="412">C1 330p</text>
    <text x="306" y="268" fill="#eb6f92">test R</text>
    <text x="614" y="378">R3</text>
    <text x="644" y="430">R4</text>
    <text x="616" y="462">C2</text>
    <text x="604" y="206">C3</text>
  </g>

  <!-- side notes -->
  <g font-size="13">
    <text x="790" y="120" fill="#e0def4" font-size="16" font-weight="700">Power</text>
    <text x="790" y="146" fill="#e0def4">+ rail: T-Beam 3V3 for this test</text>
    <text x="790" y="164" fill="#908caa">(final build: GPIO 25)</text>
    <text x="790" y="186" fill="#e0def4">− rail: T-Beam GND</text>
    <text x="790" y="204" fill="#908caa">Bridge left and right rails.</text>
    <text x="790" y="230" fill="#eb6f92" font-weight="700">Breadboard supply: 3.3 V only,</text>
    <text x="790" y="248" fill="#eb6f92" font-weight="700">GND tied to the T-Beam GND.</text>
    <text x="790" y="290" fill="#e0def4" font-size="16" font-weight="700">Direction</text>
    <text x="790" y="316" fill="#e0def4">Only the chip has one:</text>
    <text x="790" y="334" fill="#e0def4">notch toward row 1, pin 1 in e10.</text>
    <text x="790" y="352" fill="#908caa">Resistors and these capacitors</text>
    <text x="790" y="370" fill="#908caa">go in either way round.</text>
    <text x="790" y="412" fill="#e0def4" font-size="16" font-weight="700">Reading the codes</text>
    <text x="790" y="438" fill="#908caa">331 = 33 + 1 zero = 330 pF</text>
    <text x="790" y="456" fill="#908caa">104 = 10 + 4 zeros = 100 nF</text>
    <text x="790" y="474" fill="#908caa">Unsure of a band? Measure it:</text>
    <text x="790" y="492" fill="#908caa">the multimeter decides.</text>
  </g>

  <!-- parts table -->
  <rect x="30" y="645" width="1040" height="330" rx="10" fill="#1f1d2e"/>
  <text x="50" y="674" fill="#e0def4" font-size="16" font-weight="700">Parts: what each label is, and where it goes</text>
  <g font-size="12" font-weight="700" fill="#908caa">
    <text x="50" y="700">Label</text>
    <text x="130" y="700">What it is</text>
    <text x="300" y="700">Looks like</text>
    <text x="580" y="700">Its job</text>
    <text x="880" y="700">Holes</text>
  </g>
  <g font-size="13">
    <text x="50" y="724" fill="#e0def4" font-weight="700">U1</text>
    <text x="130" y="724" fill="#e0def4">MCP6002 chip</text>
    <text x="300" y="724" fill="#908caa">black, 8 legs, notch at one end</text>
    <text x="580" y="724" fill="#908caa">A ticks (pins 1-3), B holds 1.65 V (5-7)</text>
    <text x="880" y="724" fill="#e0def4">e10-e13, f10-f13</text>
    <text x="50" y="743" fill="#e0def4" font-weight="700">R1</text>
    <text x="130" y="743" fill="#e0def4">1 MΩ resistor</text>
    <text x="300" y="743" fill="#908caa">brown-black-black-yellow-brown</text>
    <text x="580" y="743" fill="#908caa">with R2, sets when the output flips</text>
    <text x="880" y="743" fill="#e0def4">a12 to a15</text>
    <text x="50" y="762" fill="#e0def4" font-weight="700">R2</text>
    <text x="130" y="762" fill="#e0def4">1 MΩ resistor</text>
    <text x="300" y="762" fill="#908caa">same bands</text>
    <text x="580" y="762" fill="#908caa">feedback: makes the flip snap cleanly</text>
    <text x="880" y="762" fill="#e0def4">c10 to c12</text>
    <text x="50" y="781" fill="#e0def4" font-weight="700">R3</text>
    <text x="130" y="781" fill="#e0def4">1 MΩ resistor</text>
    <text x="300" y="781" fill="#908caa">same bands</text>
    <text x="580" y="781" fill="#908caa">top half of the 3.3 V to 1.65 V divider</text>
    <text x="880" y="781" fill="#e0def4">j13 to + rail</text>
    <text x="50" y="800" fill="#e0def4" font-weight="700">R4</text>
    <text x="130" y="800" fill="#e0def4">1 MΩ resistor</text>
    <text x="300" y="800" fill="#908caa">same bands</text>
    <text x="580" y="800" fill="#908caa">bottom half of that divider</text>
    <text x="880" y="800" fill="#e0def4">i13 to − rail</text>
    <text x="50" y="819" fill="#e0def4" font-weight="700">C1</text>
    <text x="130" y="819" fill="#e0def4">330 pF capacitor</text>
    <text x="300" y="819" fill="#908caa">small, printed 331</text>
    <text x="580" y="819" fill="#908caa">the timer, charged through the wood</text>
    <text x="880" y="819" fill="#e0def4">b11 to b15</text>
    <text x="50" y="838" fill="#e0def4" font-weight="700">C2</text>
    <text x="130" y="838" fill="#e0def4">100 nF capacitor</text>
    <text x="300" y="838" fill="#908caa">small, printed 104</text>
    <text x="580" y="838" fill="#908caa">keeps the 1.65 V steady</text>
    <text x="880" y="838" fill="#e0def4">h13 to − rail</text>
    <text x="50" y="857" fill="#e0def4" font-weight="700">C3</text>
    <text x="130" y="857" fill="#e0def4">100 nF capacitor</text>
    <text x="300" y="857" fill="#908caa">small, printed 104</text>
    <text x="580" y="857" fill="#908caa">smooths the chip's supply</text>
    <text x="880" y="857" fill="#e0def4">h10 to − rail</text>
    <text x="50" y="876" fill="#eb6f92" font-weight="700">test R</text>
    <text x="130" y="876" fill="#e0def4">1 MΩ or 10 MΩ</text>
    <text x="300" y="876" fill="#908caa">10 MΩ: brown-black-black-green-brown</text>
    <text x="580" y="876" fill="#908caa">stands in for the wood</text>
    <text x="880" y="876" fill="#e0def4">d10 to d11</text>
    <text x="50" y="895" fill="#9ccfd8" font-weight="700">link</text>
    <text x="130" y="895" fill="#e0def4">short wire</text>
    <text x="580" y="895" fill="#908caa">joins pins 6 and 7</text>
    <text x="880" y="895" fill="#e0def4">g11 to g12</text>
    <text x="50" y="914" fill="#9ccfd8" font-weight="700">jumper</text>
    <text x="130" y="914" fill="#e0def4">longer wire</text>
    <text x="580" y="914" fill="#908caa">carries 1.65 V to the left side</text>
    <text x="880" y="914" fill="#e0def4">h11 to d15</text>
    <text x="50" y="933" fill="#908caa" font-weight="700">wires</text>
    <text x="130" y="933" fill="#e0def4">short wires</text>
    <text x="580" y="933" fill="#908caa">supply and ground to the chip</text>
    <text x="880" y="933" fill="#e0def4">j10 to +, a13 to −</text>
    <text x="50" y="952" fill="#f6c177" font-weight="700">out</text>
    <text x="130" y="952" fill="#e0def4">wire to T-Beam</text>
    <text x="580" y="952" fill="#908caa">output to GPIO 13 or meter</text>
    <text x="880" y="952" fill="#e0def4">a10</text>
  </g>

  <!-- test -->
  <rect x="30" y="990" width="1040" height="190" rx="10" fill="#1f1d2e"/>
  <text x="50" y="1019" fill="#e0def4" font-size="16" font-weight="700">Test (meter in Hz between a10 and the − rail)</text>
  <g font-size="13" fill="#e0def4">
    <text x="50" y="1045">1. Test R = 1 MΩ: about 1.4 kHz.</text>
    <text x="50" y="1067">2. Test R = 10 MΩ: about 140 Hz. Ten times the resistance, ten times slower.</text>
    <text x="50" y="1089">3. Test R removed: the ticking stops. Nothing between d10 and d11 should conduct.</text>
    <text x="50" y="1119" fill="#908caa">Design values: real parts shift them a little, and calibration takes care of that.</text>
    <text x="50" y="1141" fill="#908caa">The breadboard itself leaks at 100 MΩ and above: use it for 1-10 MΩ only. For calibration and real</text>
    <text x="50" y="1159" fill="#908caa">readings, solder the circuit per oscillator_wiring_map.svg, with pin 2 in the air.</text>
  </g>
</svg>
