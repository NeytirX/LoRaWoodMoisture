[env:ttgo-t-beam]
platform = espressif32
board = ttgo-t-beam
framework = arduino
monitor_speed = 115200
lib_deps =
    mcci-catena/MCCI LoRaWAN LMIC library @ ^4.1.1
    lewisxhe/XPowersLib @ ^0.1.5
    ElectronicCats/CayenneLPP @ ^1.1.0
build_flags =
    ; General flags
    -D ARDUINO_LMIC_CFG_NETWORK_LORAWAN ; Use LoRaWAN network mode
    -I include ; Ensure lmic_project_config.h is found in the include directory

    ; --- LORAWAN REGION AND RADIO CONFIGURATION ---
    ; These are examples. Uncomment the one you need and ensure
    ; it matches your lmic_project_config.h settings.
    ; For EU433 with SX1262 (ensure lmic_project_config.h also sets these)
    -D CFG_eu433=1
    -D CFG_sx1262_radio=1

    ; For US915 with SX1262 (ensure lmic_project_config.h also sets these)
    ; -D CFG_us915=1
    ; -D CFG_sx1262_radio=1

    ; --- OPTIONAL LOW POWER FLAGS (Use with caution) ---
    ; Disable Brownout Detector for potentially lower power.
    ; Test thoroughly as it can lead to instability if voltage drops too low.
    ; -D CONFIG_ESP32_BROWNOUT_DET=0

    ; Enable PSRAM if your T-Beam has it and it'''s needed
    ; -DBOARD_HAS_PSRAM
    ; -mfix-esp32-psram-cache-issue

upload_speed = 921600

; Serial Monitor filter to exclude some verbose LMIC messages if needed
; monitor_filters = log2file, default, esp32_exception_decoder
; monitor_filters = esp32_exception_decoder, default
; monitor_filters = direct ; To see raw output

; Debug options
; debug_tool = esp-prog
; debug_init_break = tbreak setup
