; PlatformIO Configuration for Wood Moisture Sensor (LoRaWAN)
; Target: TTGO T-Beam v1.1/v1.2 (ESP32 + SX1262 + AXP192/AXP2101)
; LoRaWAN stack: RadioLib (supports SX1262 + EU433)

[platformio]
; Only the firmware env builds by default. The ttn-test env needs
; src/ttn_test.cpp, which is gitignored local bench tooling - a fresh
; clone does not have it.
default_envs = ttgo-t-beam

[env:ttgo-t-beam]
; DO NOT upgrade this platform without migrating two APIs that pin us to it:
;   - temprature_sens_read() (sensor.h) -> IDF temperature sensor driver
;     (temperature_sensor_install / temperature_sensor_get_celsius); the
;     undocumented intrinsic is removed in newer ESP32 Arduino cores.
;   - esp_task_wdt_init(timeout, bool) (main.cpp) -> esp_task_wdt_config_t
;     struct init; the bool signature is Arduino-ESP32 v2.x only (v3.x/IDF 5).
platform = espressif32
board = ttgo-t-beam
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<ttn_test.cpp>

lib_deps =
    jgromes/RadioLib @ ^7.1.0                        ; LoRaWAN + SX1262 support
    electroniccats/CayenneLPP @ ^1.6.0               ; Cayenne Low Power Payload encoding
    lewisxhe/XPowersLib @ ^0.1.9                     ; AXP192/AXP2101 PMIC management
    paulstoffregen/OneWire @ ^2.3.8                   ; 1-Wire bus protocol (for DS18B20)
    milesburton/DallasTemperature @ ^3.11.0           ; DS18B20 temperature sensor

build_flags =
    -I include
    ; RadioLib does not require build_flags for region/radio selection.
    ; Region (EU433) and radio (SX1262) are configured in code.

    ; --- OPTIONAL LOW POWER FLAGS (Use with caution) ---
    ; Disable Brownout Detector for potentially lower power.
    ; Test thoroughly as it can lead to instability if voltage drops too low.
    ; -D CONFIG_ESP32_BROWNOUT_DET=0

upload_speed = 921600

; Serial Monitor filter
; monitor_filters = esp32_exception_decoder, default
; monitor_filters = direct ; To see raw output

; Minimal TTN connectivity test (no sensors, no sleep) - see src/ttn_test.cpp
; (gitignored local tooling; this env only builds where that file exists)
; Flash with: pio run -e ttn-test --target upload
[env:ttn-test]
extends = env:ttgo-t-beam
build_src_filter = +<*> -<main.cpp>

; Off-target unit tests for the pure MC math (include/wood_mc_math.h).
; Run with: pio test -e native
; src/ is excluded (main.cpp needs Arduino/RadioLib); the Arduino surface the
; data headers need comes from the stub in test/native_shims/.
[env:native]
platform = native
test_framework = unity
test_build_src = no
test_ignore = native_shims
build_flags =
    -I include
    -I test/native_shims
    -D NATIVE_BUILD
    -std=gnu++17
