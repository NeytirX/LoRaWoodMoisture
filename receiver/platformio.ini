; PlatformIO config for the gateway-less LoRa receiver.
; Target: Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262), 433 MHz variant.
;
; This is a STANDALONE project, deliberately separate from the sensor firmware:
; different board, different MCU, different libraries, opposite job (listen, not
; measure). It shares only the wire format in include/p2p_frame.h.
;
; Build / flash / monitor:
;   pio run
;   pio run --target upload
;   pio device monitor -b 115200

[env:heltec-v3-rx]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200

lib_deps =
    jgromes/RadioLib @ ^7.1.0          ; SX1262 driver (matches sensor firmware)
    knolleary/PubSubClient @ ^2.8      ; MQTT client
    bblanchon/ArduinoJson @ ^7         ; JSON serialization for serial + MQTT

build_flags =
    -I include
